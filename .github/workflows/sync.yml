name: Sync BGG collection

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run BGG sync
        env:
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
        run: python sync_bgg.py

      - name: Commit updated collection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collection.json
          git diff --cached --quiet || git commit -m "Update BGG collection"
          git push
