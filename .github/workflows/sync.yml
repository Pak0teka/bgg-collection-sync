name: Sync BGG collection

on:
  push:
    paths:
      - 'sync_bgg.py'
      - 'sync_plays.py'
      - 'sync_discovery.py'
      - 'pakoteca-history-public.pem'
      - '.github/workflows/sync.yml'
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run BGG sync
        env:
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
        run: python sync_bgg.py

      - name: Install history encryption
        run: python -m pip install cryptography==46.0.3

      - name: Sync encrypted BGG history
        env:
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
        run: python sync_plays.py

      - name: Sync public discovery sources
        env:
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
        run: python sync_discovery.py

      - name: Commit updated collection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collection.json plays.encrypted.json discovery.json
          git diff --cached --quiet || git commit -m "Update BGG collection"
          git push
